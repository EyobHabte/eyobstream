<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Match Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { margin: 0; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; color: #fff; font-family: sans-serif; }
    video { width: 100%; max-width: 1280px; height: auto; background: #111; }
    #error-msg { color: #ff5555; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <video id="video" controls autoplay playsinline></video>
  <div id="error-msg"></div>

  <script>
    const streamUrl = "https://melissa-dining-equivalent-suggested.trycloudflare.com/stream.m3u8";

    const video = document.getElementById('video');
    const errorDiv = document.getElementById('error-msg');

    if (Hls.isSupported()) {
      const hls = new Hls({
        debug: false,
        xhrSetup: function (xhr, url) {
          xhr.withCredentials = false; // Fixes CORS blocking on Cloudflare tunnels
        }
      });
      
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play().catch(e => console.log("Auto-play blocked:", e));
      });

      hls.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal) {
          switch (data.type) {
            case Hls.ErrorTypes.NETWORK_ERROR:
              errorDiv.innerText = "Network error: Stream offline or URL changed.";
              hls.startLoad();
              break;
            case Hls.ErrorTypes.MEDIA_ERROR:
              errorDiv.innerText = "Media error trying to recover...";
              hls.recoverMediaError();
              break;
            default:
              errorDiv.innerText = "Fatal error. Please refresh the page.";
              hls.destroy();
              break;
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', function() {
        video.play();
      });
    }
  </script>
</body>
</html>
